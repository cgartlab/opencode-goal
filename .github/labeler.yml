# 自动标签规则：分支名 + 改动文件（actions/labeler v5 配置）
# 注意：changed-files 必须用 any-glob-to-any-file 包装（labeler v5 语法）
feat:
  - head-branch: ["^feat", "^feature"]
fix:
  - head-branch: ["^fix"]
docs:
  - head-branch: ["^docs"]
  - changed-files:
      - any-glob-to-any-file: ["**/*.md"]
chore:
  - head-branch: ["^chore"]
infra:
  - changed-files:
      - any-glob-to-any-file: [".github/**", ".gitignore", "package.json", "package-lock.json", "tsconfig.json"]