name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v），如 0.4.0"
        required: true
        type: string

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 校验版本号格式
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号必须形如 x.y.z（收到：$VERSION）" >&2
            exit 1
          fi
      - name: 打 tag
        uses: actions/github-script@v7
        with:
          script: |
            const v = `v${context.payload.inputs.version}`;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${v}`,
              sha: context.sha,
            });

  release:
    # 只在 push tag（v*）事件下执行；workflow_dispatch 仅用来打 tag（上面的 tag job），
    # 打 tag 后会触发新的 push-tag run 在此执行——避免 dispatch run 里 GITHUB_REF 指向 main 制造垃圾 Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 从 CHANGELOG 提取条目并创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          VER_ESC=$(printf '%s' "$VER" | sed 's/\./\\./g')
          BODY=$(awk -v esc="$VER_ESC" '
            $0 ~ /^## \[/ { if (insec) exit; if ($0 ~ "^## \\[" esc "\\]") insec=1; next }
            insec { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release $TAG"
          fi
          gh release create "$TAG" \
            --title "opencode-goal $TAG" \
            --notes "$BODY"
